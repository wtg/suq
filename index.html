<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speaker Queue</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: monospace;
      background: #111;
      color: #ccc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 8px 16px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #888;
    }
    header h1 { font-size: 14px; color: #ccc; }
    kbd {
      background: #222;
      border: 1px solid #444;
      border-radius: 2px;
      padding: 0 4px;
      font-family: monospace;
      font-size: 12px;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow: hidden;
    }
    .input-area { position: relative; }
    #speaker-input {
      width: 100%;
      padding: 8px 12px;
      font-size: 16px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #ccc;
      outline: none;
      font-family: monospace;
    }
    #speaker-input:focus { border-color: #888; }
    #speaker-input::placeholder { color: #555; }
    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1a1a1a;
      border: 1px solid #333;
      border-top: none;
      max-height: 200px;
      overflow-y: auto;
      z-index: 10;
      display: none;
    }
    .autocomplete-list.visible { display: block; }
    .autocomplete-item {
      padding: 4px 12px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }
    .autocomplete-item.selected { background: #333; }
    .autocomplete-item .count { color: #666; }
    .current-speaker {
      border: 1px solid #555;
      padding: 12px 16px;
      text-align: center;
    }
    .current-speaker .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 4px;
    }
    .current-speaker .name { font-size: 22px; font-weight: bold; color: #fff; }
    .current-speaker .time {
      font-size: 14px;
      color: #888;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .current-speaker .empty { color: #555; }
    .queue-stack { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .queue-level { border: 1px solid #333; }
    .queue-level.active { border-color: #888; }
    .queue-level-header {
      padding: 4px 12px;
      background: #1a1a1a;
      font-size: 12px;
      color: #888;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #333;
    }
    .queue-level.active .queue-level-header { color: #ccc; }
    .queue-item {
      padding: 4px 12px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }
    .queue-item:first-child { color: #fff; }
    .queue-item .speak-count { color: #666; font-size: 12px; }
    .queue-empty { color: #555; padding: 8px 12px; font-size: 13px; }
    footer {
      padding: 6px 16px;
      border-top: 1px solid #333;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #555;
    }
    .dialog-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .dialog-overlay.visible { display: flex; }
    .dialog {
      background: #1a1a1a;
      border: 1px solid #444;
      padding: 20px;
      max-width: 340px;
      text-align: center;
      font-size: 14px;
    }
    .dialog p { margin-bottom: 12px; }
    .dialog .dialog-buttons { display: flex; gap: 12px; justify-content: center; }
    .dialog button {
      padding: 6px 16px;
      border: 1px solid #444;
      background: #222;
      color: #ccc;
      font-family: monospace;
      font-size: 13px;
      cursor: pointer;
    }
    .dialog button.danger { background: #800; border-color: #a00; color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Speaker Queue</h1>
    <div>
      <kbd>Enter</kbd> add &nbsp;
      <kbd>Tab</kbd> complete &nbsp;
      <kbd>Space</kbd> next &nbsp;
      <kbd>Ctrl+O</kbd> open sub &nbsp;
      <kbd>Ctrl+W</kbd> close sub &nbsp;
      <kbd>Ctrl+Z</kbd> undo &nbsp;
      <kbd>Esc</kbd> clear input &nbsp;
      <kbd>Ctrl+⌫</kbd> reset
    </div>
  </header>

  <div class="main">
    <div class="input-area">
      <input type="text" id="speaker-input" placeholder="Speaker name…" autocomplete="off" spellcheck="false">
      <div class="autocomplete-list" id="autocomplete"></div>
    </div>

    <div class="current-speaker" id="current-speaker">
      <div class="label">Now Speaking</div>
      <div class="empty">No one is speaking</div>
    </div>

    <div class="queue-stack" id="queue-stack"></div>
  </div>

  <footer>
    <span id="total-speakers">0 speakers tracked</span>
    <span id="total-speeches">0 speeches given</span>
  </footer>

  <div class="dialog-overlay" id="reset-dialog">
    <div class="dialog">
      <p>Reset all speaker counts and clear all queues?</p>
      <div class="dialog-buttons">
        <button onclick="closeResetDialog()">Cancel <kbd>Esc</kbd></button>
        <button class="danger" onclick="confirmReset()">Reset <kbd>Enter</kbd></button>
      </div>
    </div>
  </div>

  <script>
    // --- State ---
    let speakCounts = new Map();
    let queueStack = [{ label: 'Main', queue: [] }];
    let currentSpeaker = null;
    let undoStack = [];

    // --- Stopwatch ---
    let speakerStartTime = null;
    let stopwatchInterval = null;

    function startStopwatch() {
      stopStopwatch();
      speakerStartTime = Date.now();
      stopwatchInterval = setInterval(renderStopwatch, 200);
      renderStopwatch();
    }

    function stopStopwatch() {
      if (stopwatchInterval) {
        clearInterval(stopwatchInterval);
        stopwatchInterval = null;
      }
      speakerStartTime = null;
    }

    function formatElapsed(ms) {
      const totalSec = Math.floor(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      return min.toString().padStart(2, '0') + ':' + sec.toString().padStart(2, '0');
    }

    function renderStopwatch() {
      const el = document.getElementById('stopwatch');
      if (!el || !speakerStartTime) return;
      el.textContent = formatElapsed(Date.now() - speakerStartTime);
    }

    // --- Persistence ---
    function saveState() {
      localStorage.setItem('suq-state', JSON.stringify({
        speakCounts: Array.from(speakCounts.entries()),
        queueStack,
        currentSpeaker,
      }));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem('suq-state');
        if (!raw) return;
        const s = JSON.parse(raw);
        speakCounts = new Map(s.speakCounts);
        queueStack = s.queueStack || [{ label: 'Main', queue: [] }];
        currentSpeaker = s.currentSpeaker || null;
      } catch { /* start fresh */ }
    }

    // --- Undo ---
    function snapshot() {
      return {
        speakCounts: new Map(speakCounts),
        queueStack: queueStack.map(l => ({ label: l.label, queue: [...l.queue] })),
        currentSpeaker,
      };
    }

    function pushUndo() {
      undoStack.push(snapshot());
      if (undoStack.length > 50) undoStack.shift();
    }

    function undo() {
      if (undoStack.length === 0) return;
      const prev = undoStack.pop();
      const hadSpeaker = currentSpeaker;
      speakCounts = prev.speakCounts;
      queueStack = prev.queueStack;
      currentSpeaker = prev.currentSpeaker;
      // Restart stopwatch if speaker changed
      if (currentSpeaker !== hadSpeaker) {
        if (currentSpeaker) startStopwatch(); else stopStopwatch();
      }
      saveState();
      render();
    }

    // --- Active queue helpers ---
    function activeLevel() {
      return queueStack[queueStack.length - 1];
    }

    function getCount(name) {
      return speakCounts.get(name) || 0;
    }

    // --- Queue operations ---
    function enqueue(name) {
      const q = activeLevel().queue;
      if (q.includes(name)) return;
      if (name === currentSpeaker) return;

      pushUndo();

      if (!speakCounts.has(name)) speakCounts.set(name, 0);

      const count = getCount(name);
      let i = q.length;
      while (i > 0 && getCount(q[i - 1]) > count) i--;
      q.splice(i, 0, name);

      if (currentSpeaker === null) {
        advanceSpeaker();
      } else {
        saveState();
        render();
      }
    }

    function advanceSpeaker() {
      pushUndo();

      if (currentSpeaker !== null) {
        speakCounts.set(currentSpeaker, getCount(currentSpeaker) + 1);
      }

      const q = activeLevel().queue;
      if (q.length > 0) {
        currentSpeaker = q.shift();
        startStopwatch();
      } else {
        currentSpeaker = null;
        stopStopwatch();
      }

      saveState();
      render();
    }

    // --- Subqueue (subsidiary motion) ---
    function openSubqueue() {
      pushUndo();
      const depth = queueStack.length;
      queueStack.push({ label: 'Subsidiary motion ' + depth, queue: [] });
      saveState();
      render();
    }

    function closeSubqueue() {
      if (queueStack.length <= 1) return;
      pushUndo();
      queueStack.pop();
      saveState();
      render();
    }

    // --- Autocomplete ---
    let acResults = [];
    let acIndex = -1;

    function updateAutocomplete(value) {
      const ac = document.getElementById('autocomplete');
      if (!value.trim()) {
        ac.classList.remove('visible');
        acResults = [];
        acIndex = -1;
        return;
      }

      const query = value.toLowerCase();
      acResults = Array.from(speakCounts.keys())
        .filter(name => name.toLowerCase().includes(query))
        .sort((a, b) => {
          const aStarts = a.toLowerCase().startsWith(query) ? 0 : 1;
          const bStarts = b.toLowerCase().startsWith(query) ? 0 : 1;
          if (aStarts !== bStarts) return aStarts - bStarts;
          return a.localeCompare(b);
        })
        .slice(0, 8);

      acIndex = -1;
      renderAutocomplete();
    }

    function renderAutocomplete() {
      const ac = document.getElementById('autocomplete');
      if (acResults.length === 0) {
        ac.classList.remove('visible');
        return;
      }
      ac.innerHTML = acResults.map((name, i) =>
        `<div class="autocomplete-item${i === acIndex ? ' selected' : ''}" onmousedown="pickAutocomplete(${i})">
          <span>${escapeHtml(name)}</span>
          <span class="count">${getCount(name)}</span>
        </div>`
      ).join('');
      ac.classList.add('visible');
    }

    function pickAutocomplete(index) {
      const input = document.getElementById('speaker-input');
      input.value = acResults[index];
      closeAutocomplete();
      input.focus();
    }

    function closeAutocomplete() {
      document.getElementById('autocomplete').classList.remove('visible');
      acResults = [];
      acIndex = -1;
    }

    function cycleAutocomplete(dir) {
      if (acResults.length === 0) return false;
      acIndex += dir;
      if (acIndex >= acResults.length) acIndex = 0;
      if (acIndex < 0) acIndex = acResults.length - 1;

      document.getElementById('speaker-input').value = acResults[acIndex];
      renderAutocomplete();
      return true;
    }

    // --- Render ---
    function render() {
      // Current speaker
      const csEl = document.getElementById('current-speaker');
      if (currentSpeaker) {
        csEl.innerHTML =
          `<div class="label">Now Speaking</div>` +
          `<div class="name">${escapeHtml(currentSpeaker)}</div>` +
          `<div class="time" id="stopwatch">00:00</div>`;
        renderStopwatch();
      } else {
        csEl.innerHTML = `<div class="label">Now Speaking</div><div class="empty">No one is speaking</div>`;
      }

      // Queue stack
      const stackEl = document.getElementById('queue-stack');
      stackEl.innerHTML = queueStack.map((level, li) => {
        const isActive = li === queueStack.length - 1;
        const items = level.queue.length === 0
          ? '<div class="queue-empty">Empty</div>'
          : level.queue.map((name, i) =>
              `<div class="queue-item">
                <span>${i + 1}. ${escapeHtml(name)}</span>
                <span class="speak-count">${getCount(name)} prior</span>
              </div>`
            ).join('');
        return `<div class="queue-level${isActive ? ' active' : ''}">
          <div class="queue-level-header">
            <span>${escapeHtml(level.label)}</span>
            <span>${level.queue.length} queued</span>
          </div>
          ${items}
        </div>`;
      }).join('');

      // Footer
      document.getElementById('total-speakers').textContent =
        `${speakCounts.size} speaker${speakCounts.size !== 1 ? 's' : ''}`;
      const total = Array.from(speakCounts.values()).reduce((a, b) => a + b, 0);
      document.getElementById('total-speeches').textContent =
        `${total} speech${total !== 1 ? 'es' : ''}`;
    }

    // --- Reset dialog ---
    function showResetDialog() {
      document.getElementById('reset-dialog').classList.add('visible');
    }
    function closeResetDialog() {
      document.getElementById('reset-dialog').classList.remove('visible');
      document.getElementById('speaker-input').focus();
    }
    function confirmReset() {
      pushUndo();
      speakCounts.clear();
      queueStack = [{ label: 'Main', queue: [] }];
      currentSpeaker = null;
      stopStopwatch();
      saveState();
      render();
      closeResetDialog();
    }

    // --- Utilities ---
    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // --- Keyboard ---
    const input = document.getElementById('speaker-input');

    input.addEventListener('input', () => {
      updateAutocomplete(input.value);
    });

    input.addEventListener('keydown', (e) => {
      // Tab: cycle autocomplete
      if (e.key === 'Tab') {
        e.preventDefault();
        if (acResults.length > 0) {
          cycleAutocomplete(e.shiftKey ? -1 : 1);
        }
        return;
      }

      // Enter: enqueue whatever is in the input
      if (e.key === 'Enter') {
        e.preventDefault();
        const name = input.value.trim();
        if (name) {
          enqueue(name);
          input.value = '';
          closeAutocomplete();
        }
        return;
      }

      // Escape: clear input
      if (e.key === 'Escape') {
        e.preventDefault();
        input.value = '';
        closeAutocomplete();
        return;
      }
    });

    // Global shortcuts
    document.addEventListener('keydown', (e) => {
      const dialogOpen = document.getElementById('reset-dialog').classList.contains('visible');

      // Dialog keys
      if (dialogOpen) {
        if (e.key === 'Escape') { e.preventDefault(); closeResetDialog(); }
        if (e.key === 'Enter') { e.preventDefault(); confirmReset(); }
        return;
      }

      // Ctrl+Z: undo
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        undo();
        return;
      }

      // Space: advance speaker (when input is empty or not focused)
      if (e.key === ' ' && (document.activeElement !== input || input.value === '')) {
        e.preventDefault();
        advanceSpeaker();
        return;
      }

      // Ctrl+O: open subqueue
      if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
        e.preventDefault();
        openSubqueue();
        return;
      }

      // Ctrl+W: close subqueue
      if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
        e.preventDefault();
        closeSubqueue();
        return;
      }

      // Ctrl+Backspace: reset
      if ((e.ctrlKey || e.metaKey) && e.key === 'Backspace') {
        e.preventDefault();
        showResetDialog();
        return;
      }

      // Auto-focus input on printable chars
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        if (document.activeElement !== input) {
          input.focus();
        }
      }
    });

    // --- Init ---
    loadState();
    render();
    if (currentSpeaker) startStopwatch();
    input.focus();
  </script>
</body>
</html>
